metadata: {description: 'Fastest way to launch yourself into a workout. Literally be in bed buddy and flex your glutes for 20 seconds. Life is about getting things done. This is your new wake up friend. Lunch time friend. Watching tv friend. Ok I oversold it, but use it anyway.', glutes on: null, logo_img: 'asset:poundfighter.png', title: 'PoundFighter - brain off, glutes on'}
name: PoundFighter
native_deps:
  head_html: |-
    <style>
      /* Loading screen: app icon with a spinning gold ring, on the game's dark background.
         Anvil hides its default dots when the spinner has a background image. */
      html, body { background: #140e0c; }
      :root { --anvil-spinner-bg: #140e0c; --anvil-spinner-size: 104px; --anvil-spinner-shadow: 0px; }
      #loadingSpinner.anvil-spinner {
        width: 104px; height: 104px; top: calc(42% - 52px);
        background: url(_/theme/app/icon-192.png) center / cover no-repeat, #140e0c;
        box-shadow: 0 0 40px rgba(255, 190, 40, .45);
        animation: pf-pulse 1.4s ease-in-out infinite;
      }
      #loadingSpinner.anvil-spinner::after {
        content: ''; position: absolute; inset: -12px; border-radius: 50%;
        border: 4px solid transparent; border-top-color: #ffd34d; border-right-color: rgba(255, 211, 77, .35);
        animation: pf-spin .9s linear infinite;
      }
      @keyframes pf-pulse { 50% { transform: scale(1.06); box-shadow: 0 0 60px rgba(255, 190, 40, .65); } }
      @keyframes pf-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #loadingSpinner.anvil-spinner, #loadingSpinner.anvil-spinner::after { animation-duration: 3s; } }
    </style>
    <script>
      // Capture the browser's "Install app" prompt so the game can offer it
      window.pfInstallPrompt = null;
      function pfNotifyGame(event) {
        var f = document.querySelector('iframe[data-pf-app]');
        if (f && f.contentWindow) f.contentWindow.postMessage(JSON.stringify({pf: 1, event: event}), location.origin);
      }
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.pfInstallPrompt = e;
        pfNotifyGame('installable');
      });
      window.addEventListener('appinstalled', function () {
        window.pfInstallPrompt = null;
        pfNotifyGame('installed');
      });
      window.pfInstall = async function () {
        var p = window.pfInstallPrompt;
        if (!p) return 'unavailable';
        window.pfInstallPrompt = null;
        p.prompt();
        var choice = await p.userChoice;
        return choice.outcome;
      };
    </script>
    <script>


      function isScreenLockSupported() {
        return ('wakeLock' in navigator);
      }
      var screenLock;
      async function lockWakeState() {
        console.log("asked to keep awake");
        if(isScreenLockSupported()){
          try {
            screenLock = await navigator.wakeLock.request('screen');
          } catch(err) {
            console.log(err.name, err.message);
          }
          return screenLock;
        }
      }
      function releaseWakeState() { 
        console.log("asked to be able to sleep");
        if(typeof screenLock !== "undefined" && screenLock != null) {
          screenLock.release()
            .then(() => {
              console.log("Lock released 🎈");
              screenLock = null;
            });
        }
      }  
    </script>
package_name: PoundFighter
