allow_embedding: false
db_schema:
  users:
    client: none
    columns:
    - admin_ui: {order: 0, width: 200}
      name: email
      type: string
    - admin_ui: {order: 1, width: 200}
      name: enabled
      type: bool
    - admin_ui: {order: 2, width: 200}
      name: last_login
      type: datetime
    - admin_ui: {order: 3, width: 200}
      name: password_hash
      type: string
    - admin_ui: {order: 4, width: 200}
      name: n_password_failures
      type: number
    - admin_ui: {order: 5, width: 200}
      name: confirmed_email
      type: bool
    server: full
    title: Users
dependencies:
- dep_id: dep_n18z5lce3xl8g
  resolution_hints: {app_id: 4UK6WHQ6UX7AKELK, name: Material 3 Theme, package_name: m3}
  version: {version_tag: v1.2.5}
metadata: {title: PoundFighter - goal based workouts}
name: PoundFighter
native_deps:
  head_html: "<script>\n\n\n  function isScreenLockSupported() {\n    return ('wakeLock' in navigator);\n  }\n  var screenLock;\n  async function lockWakeState() {\n    console.log(\"asked to keep awake\");\n    if(isScreenLockSupported()){\n      try {\n        screenLock = await navigator.wakeLock.request('screen');\n      } catch(err) {\n        console.log(err.name, err.message);\n      }\n      return screenLock;\n    }\n  }\n  function releaseWakeState() { \n    console.log(\"asked to be able to sleep\");\n    if(typeof screenLock !== \"undefined\" && screenLock != null) {\n      screenLock.release()\n        .then(() => {\n          console.log(\"Lock released 🎈\");\n          screenLock = null;\n        });\n    }\n  }  \n</script>"
package_name: PoundFighter
runtime_options:
  client_version: '3'
  legacy_features: {__dict__: true, bootstrap3: true, class_names: true, root_container: true}
  server_spec: null
  server_version: python3-full
  version: 3
services:
- client_config: {}
  server_config: {}
  source: /runtime/services/tables.yml
- client_config: {allow_signup: false, confirm_email: true, enable_automatically: true, use_email: true}
  server_config: {user_table: users}
  source: /runtime/services/anvil/users.yml
startup: {module: flipdown_anvil, type: form}
startup_form: null
