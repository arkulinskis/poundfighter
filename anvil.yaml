metadata:
  description: "Micro workouts for your workday, turned into a monster-collecting game: do reps in bed, at your desk or standing, count them by voice, and capture 36 monsters."
  logo_img: "asset:poundfighter.png"
  title: "PoundFighter: micro workouts as a monster-collecting game"
name: PoundFighter
native_deps:
  head_html: |
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#140e0c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link id="ui-favicon" rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%23ff6b2c%22/%3E%3Ctext x=%2250%22 y=%2272%22 font-size=%2264%22 text-anchor=%22middle%22 font-family=%22Arial Black,sans-serif%22 fill=%22%231a0d06%22%3EP%3C/text%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="_/theme/app/icon-192.png?v=75d614bea0">
    <script>
    /* Keep our tab icon: Anvil adds its own <link rel="icon">, so drop any other icon link. */
    (function () {
      function keep() {
        var ours = document.getElementById('ui-favicon');
        if (!ours) return;
        document.querySelectorAll('link[rel~="icon"]').forEach(function (l) { if (l !== ours) l.remove(); });
      }
      keep();
      document.addEventListener('DOMContentLoaded', keep);
      window.addEventListener('load', keep);
    })();
    </script>
    <script src="_/theme/legal-kit.js?v=176d2d14ac"></script>
    <!-- seo:start (APP_MAKER/seo: edit seo/apps/poundfighter.json and run seo.py, not here) -->
    <link rel="canonical" href="https://poundfighter.com/">
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <meta name="keywords" content="micro workouts, desk exercises, workout game, exercise at your desk, workout in bed, fitness game browser, glute exercises, office workout app, gamified fitness">
    <meta name="author" content="Arkvital">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="PoundFighter">
    <meta property="og:title" content="PoundFighter: micro workouts as a monster-collecting game">
    <meta property="og:description" content="Micro workouts for your workday, turned into a monster-collecting game: do reps in bed, at your desk or standing, count them by voice, and capture 36 monsters.">
    <meta property="og:locale" content="en_CA">
    <meta property="og:url" content="https://poundfighter.com/">
    <meta property="og:image" content="https://poundfighter.com/_/theme/og-image.png">
    <meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="PoundFighter: Brain off, glutes on. Micro workouts that catch monsters.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="PoundFighter: micro workouts as a monster-collecting game">
    <meta name="twitter:description" content="Micro workouts for your workday, turned into a monster-collecting game: do reps in bed, at your desk or standing, count them by voice, and capture 36 monsters.">
    <meta name="twitter:image" content="https://poundfighter.com/_/theme/og-image.png">
    <link rel="alternate" type="text/plain" title="PoundFighter for AI assistants" href="https://poundfighter.com/llms.txt">
    <script type="application/ld+json">{"@context": "https://schema.org", "@graph": [{"@type": "VideoGame", "@id": "https://poundfighter.com/#app", "name": "PoundFighter", "url": "https://poundfighter.com/", "description": "Micro workouts for your workday, turned into a monster-collecting game: do reps in bed, at your desk or standing, count them by voice, and capture 36 monsters.", "image": "https://poundfighter.com/_/theme/og-image.png", "inLanguage": "en", "publisher": {"@id": "https://arkvital.com/#org"}, "keywords": "micro workouts, desk exercises, workout game, exercise at your desk, workout in bed, fitness game browser, glute exercises, office workout app, gamified fitness", "applicationCategory": "HealthApplication", "operatingSystem": "Any (web browser)", "featureList": ["Workouts for in bed, at your desk or standing", "Voice rep counting that learns the room's background noise", "36 monsters in three habitats and four rarities to collect", "Coins, combos, lures, arenas, XP and ranks", "A daily punch card that rewards little-and-often"], "audience": {"@type": "Audience", "audienceType": "Busy people who want little-and-often exercise during the day"}}, {"@type": "WebSite", "@id": "https://poundfighter.com/#site", "url": "https://poundfighter.com/", "name": "PoundFighter", "publisher": {"@id": "https://arkvital.com/#org"}}, {"@type": "Organization", "@id": "https://arkvital.com/#org", "name": "Arkvital", "url": "https://arkvital.com", "email": "arkvital@outlook.com", "address": {"@type": "PostalAddress", "addressLocality": "Montreal", "addressRegion": "QC", "addressCountry": "CA"}}]}</script>
    <!-- seo:end -->
    <!-- Prepsto feedback panel: every "Submit feedback" link and button opens it (it is the only feedback channel). Codes: APP_MAKER/prepsto-links.json -->
    <script src="https://prepsto.com/_/theme/widget.js" data-prepsto="32dqx5g" data-button="false" data-label="Submit feedback" async></script>
    <script>
      // Capture the browser's "Install app" prompt so the app can offer it (client_code/reminders.py listens for pf-install)
      window.pfInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.pfInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pf-install', { detail: 'installable' }));
      });
      window.addEventListener('appinstalled', function () {
        window.pfInstallPrompt = null;
        window.dispatchEvent(new CustomEvent('pf-install', { detail: 'installed' }));
      });
      window.pfInstall = async function () {
        var p = window.pfInstallPrompt;
        if (!p) return 'unavailable';
        window.pfInstallPrompt = null;
        p.prompt();
        var choice = await p.userChoice;
        return choice.outcome;
      };
      // The game engine (an ES module) resolves this once window.PF exists; client_code/pf.py waits on it
      window.PFReady = new Promise(function (resolve) { window.__pfReady = resolve; });
    </script>
    <link rel="stylesheet" href="_/theme/icons.css?v=78efe53179">
