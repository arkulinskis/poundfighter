    <script src="_/theme/app/js/ark-music.js?v=39180862e8"></script>
    <script type="module" src="_/theme/app/js/pf.js?v=4862e20514"></script>
package_name: PoundFighter
runtime_options:
  client_version: '3'
  server_spec:
    base: python314
  version: 3
services:
- client_config: {}
  server_config: {}
  source: /runtime/services/tables.yml
- client_config:
    allow_remember_me: true
    allow_signup: true
    confirm_email: false
    enable_automatically: true
    remember_me_days: 365
    use_email: true
    use_google: true
  server_config:
    user_table: users
  source: /runtime/services/anvil/users.yml
- client_config: {}
  server_config: {}
  source: /runtime/services/google.yml
startup:
  module: startup
  type: module
