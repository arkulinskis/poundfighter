<div class="dlg confirm ask-remind">
  <div class="acct-crest big"><i class="ic ic-bell"></i></div>
  <h2 class="dlg-title">Want a nudge to move?</h2>
  <p class="muted">Little and often beats one big workout. PoundFighter can remind you to do a one-minute fight during your day.</p>
  <p class="small schedule"><span anvil:dom-node="schedule"></span> <span class="muted">You can change this in Me.</span></p>
  <p class="small muted" anvil:name="install_note">On iPhone, add PoundFighter to your Home Screen first.</p>
  <div class="row-btns">
    <anvil-component type="Button" name="later_button" prop:text="Not now" prop:role='["btn"]'></anvil-component>
    <anvil-component type="Button" name="yes_button" prop:text="Yes, remind me" prop:role='["btn", "gold"]'></anvil-component>
  </div>
  <anvil-component type="Button" name="install_button" prop:text="Install the app too" prop:role='["link", "ic-download"]'></anvil-component>
</div>
