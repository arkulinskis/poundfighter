<div class="dlg confirm install-help">
  <div class="acct-crest"><i class="ic ic-download"></i></div>
  <h2 class="dlg-title">Install PoundFighter</h2>
  <p class="muted">On iPhone and iPad, reminders only work once PoundFighter is on your Home Screen.</p>
  <ol class="steps">
    <li>Open poundfighter.com in <b>Safari</b>.</li>
    <li>Tap the <b>Share</b> button <i class="ic ic-share"></i></li>
    <li>Choose <b>Add to Home Screen</b>.</li>
    <li>Open PoundFighter from your Home Screen and turn on reminders in <b>Me</b>.</li>
  </ol>
  <div class="row-btns">
    <anvil-component type="Button" name="ok_button" prop:text="Got it" prop:role='["btn", "gold"]'></anvil-component>
  </div>
</div>
