<div class="dlg mictest">
  <h2 class="dlg-title"><i class="ic ic-mic"></i> Tune your mic</h2>
  <p class="muted small" anvil:dom-node="status" role="status">Asking for microphone access…</p>
  <div class="meter big" aria-hidden="true"><div class="lvl" id="tLvl"></div><div class="base" id="tBase"></div><div class="thr" id="tThr"></div></div>
  <div class="legend small muted"><span><i class="k-lvl"></i>What it hears</span><span><i class="k-thr"></i>Rep line</span></div>
  <div class="tcount" aria-live="polite"><b id="tCount">0</b><span>reps heard</span></div>
  <label class="set-col">
    <span><b>Sensitivity</b> <span class="small muted" anvil:dom-node="sens_label"></span></span>
    <input type="range" min="6" max="30" step="1" aria-label="Sensitivity" anvil:dom-node="sens">
  </label>
  <div class="row-btns">
    <anvil-component type="Button" name="recalibrate_button" prop:text="Re-measure room" prop:role='["btn"]'></anvil-component>
    <anvil-component type="Button" name="done_button" prop:text="Done" prop:role='["btn", "primary"]'></anvil-component>
  </div>
</div>
