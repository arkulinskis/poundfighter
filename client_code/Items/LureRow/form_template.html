<div class="shop-item" anvil:dom-node="row">
  <div class="shop-icon"><i class="ic ic-magnet"></i></div>
  <div class="shop-text"><b anvil:dom-node="name">Rare Lure</b><span class="small muted" anvil:dom-node="desc"></span><span class="small" anvil:dom-node="owned"></span></div>
  <div class="shop-actions">
    <button type="button" class="btn small" anvil:name="buy" anvil:on-dom:click="self.buy_click"><span class="coin"><i class="coin-ic" aria-hidden="true">£</i><span anvil:dom-node="price">60</span></span></button>
    <button type="button" class="btn small" anvil:name="arm" anvil:on-dom:click="self.arm_click"><span anvil:dom-node="arm_text">Arm</span></button>
  </div>
</div>
